# Optional local feasibility tuning. Keep all collision checks and Navfn.
controller_frequency: 15.0
TebLocalPlannerROS:
  dt_ref: 0.15
  dt_hysteresis: 0.015
  exact_arc_length: true
  wheelbase: 0.26
  no_inner_iterations: 4
  no_outer_iterations: 3
  # Five finer samples check a comparable time horizon to baseline two coarse ones.
  feasibility_check_no_poses: 5
  weight_obstacle: 20.0
  weight_optimaltime: 0.5
  max_global_plan_lookahead_dist: 3.0
  global_plan_viapoint_sep: -1
